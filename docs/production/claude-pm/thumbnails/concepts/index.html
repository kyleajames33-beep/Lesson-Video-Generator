<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSCScience thumbnail concepts</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; background: #f5f2e9; color: #173e48; }
    body { margin: 0; padding: 24px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { margin: 0 0 24px; line-height: 1.4; }
    h2 { font-size: 20px; margin: 28px 0 12px; }
    .scroll { overflow-x: auto; padding: 0 0 16px; }
    .row { display: flex; gap: 18px; width: max-content; }
    figure { margin: 0; }
    figcaption { font-size: 15px; font-weight: bold; margin: 8px 0 0; }
    img { display: block; height: auto; box-shadow: 0 3px 15px #16312d25; background: white; }
    .full img { width: 1280px; }
    .small img { width: 320px; }

<body>
  <h1>HSCScience thumbnail concepts</h1>

  <div class="scroll"><div class="row full">
    <figure><a href="c3-A.png"><img src="c3-A.png" alt="C3 painted paper concept"></a><figcaption>C3 A: painted question</figcaption></figure>
